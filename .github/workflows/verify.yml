name: Verify static publication

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-publication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run publication regression suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -B -m unittest -v scripts.test_site scripts.test_release_artifact

      - name: Validate exact publication
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -I -B scripts/check_site.py

      - name: Confirm optimized Python fails closed
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          if python3 -O scripts/check_site.py; then
            echo "Validator unexpectedly accepted optimized Python" >&2
            exit 1
          fi

      - name: Build and verify exact static release artifact
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          release_dir="${RUNNER_TEMP}/liarsdice-release"
          python3 -I -B scripts/release_artifact.py build --output-dir "${release_dir}"
          python3 -I -B scripts/release_artifact.py verify \
            --release-dir "${release_dir}" \
            --expected-commit "${GITHUB_SHA}" \
            --expected-version "$(tr -d '\r\n' < VERSION)"

      - name: Retain verified release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liarsdice-static-release-${{ github.sha }}
          path: ${{ runner.temp }}/liarsdice-release/
          if-no-files-found: error
          retention-days: 14
